<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Reservation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="container">
      <p class="site-title">Study Room<span class="dot">.</span></p>
      <ul class="site-nav">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="my-reservations.html">My Reservations</a></li>
        <li><a href="admin.html">Admin</a></li>
      </ul>
    </div>
  </header>

  <main>
    <div class="container">
      <h1 class="page-heading">Create reservation</h1>
      <p class="page-subheading">Confirm the details, then submit. Your reservation starts as DRAFT until an admin confirms it.</p>

      <div id="banner-slot"></div>

      <div class="ticket">
        <div class="ticket-header">
          <div>
            <div class="room-code" id="summary-room">—</div>
            <div class="meta-line" id="summary-location">—</div>
          </div>
          <span class="stamp stamp-draft">DRAFT</span>
        </div>
        <div class="ticket-body">
          <div class="field-row">
            <div class="field">
              <label>Date</label>
              <div class="readonly-value" id="summary-date">—</div>
            </div>
            <div class="field">
              <label>Time</label>
              <div class="readonly-value" id="summary-time">—</div>
            </div>
          </div>

          <hr class="divider" />

          <form id="reservation-form">
            <div class="field">
              <label for="people">Number of people</label>
              <input type="number" id="people" name="people" min="1" required />
              <p class="helper-text" id="capacity-hint"></p>
            </div>
            <div class="field">
              <label for="purpose">Purpose</label>
              <textarea id="purpose" name="purpose" placeholder="e.g. Team meeting" required></textarea>
            </div>
            <button type="submit" class="btn-block" id="submit-btn">Create Reservation</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">Study Room Reservation &mdash; local build</footer>
</div>

<script src="js/api.js"></script>
<script src="js/create-reservation.js"></script>
</body>
</html>
